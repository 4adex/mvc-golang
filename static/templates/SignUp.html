    .user-call {

      color: #828282;
      font-family: Suwannaphum;

    }

    input[type=number],
    select {
      width: 100%;
      padding: 12px 20px;
      margin: 8px 0;
      border-radius: 7px;

      color: #828282;
      font-family: Suwannaphum;

    input[type=password],
    select {
      width: 100%;
      padding: 12px 20px;
      margin: 8px 0;
      border-radius: 7px;
      border: 1px solid #878787;
      background: #1F1E25;
      color: #828282;
      font-family: Suwannaphum;
      font-size: 14px;
      font-style: normal;
    }

    h1 {
      color: #FFF;
      text-align: center;
      font-family: Suwannaphum;

      margin: 5px;
      border-radius: 7px;
      background: #4C71F1;
      width: 140px;
      height: 60px;
      color: #FFF;

      font-family: Suwannaphum;
      font-size: 14px;
      font-style: normal;
      font-weight: 400;
      line-height: normal;

    }

    .alert {
      padding: 20px;
      margin-top: 20px;
      margin-bottom: 20px;
      border: 1px solid transparent;
      border-radius: 22px;
    }

    .alert-success {
      color: #82D365;
      border: 1px solid #82D365;

    }

    .alert-error {

      border: 1px solid #D36565;

</head>

<body>
  <div class="container">
    <header>
      <div class="header-content">
        <h1 class="logo">ShelfMaster</h1>
        <div>
          <button class="logout" onclick="HandleGet('/signup')">Signup</button>
          <button class="logout" onclick="HandleGet('/signin')">Login</button>
        </div>
      </div>
    </header>
    <div id="message-div"></div>
    <main class="main-content">
      <h1>Create New Account</h1>
      <div class="button-group">
        <form id="signupForm">
          <div class="form-element">
            <label class="form-label">Email</label>
            <input type="email" name="email" placeholder="Enter email" required />
          </div>
          <div class="form-element">
            <label class="form-label">Username</label>
            <input type="text" name="username" placeholder="Enter unique username" required />
          </div>
          <div class="form-element">
            <label class="form-label">Password</label>
            <input type="password" name="password" placeholder="Password" required />
          </div>
          <div class="form-element">
            <label class="form-label">Confirm Password</label>
            <input type="password" id="cpassword" name="cpassword" placeholder="Confirm Password" required />
          </div>
          <button class="submit-button" type="submit">Submit</button>
        </form>
      </div>
    </main>
  </div>
  <script>
    // var delay = 100;
    function displayFlashMessage() {
      // alert("Youtube");
      const flashMessage = localStorage.getItem('flashMessage');
      const flashType = localStorage.getItem('flashType');

      if (flashMessage && flashType) {
        // Display the flash message (adjust this based on your HTML structure)
        flashElement = document.getElementById('message-div');
        flashElement.textContent = flashMessage;
        flashElement.className = `alert alert-${flashType}`;
        // document.body.insertBefore(flashElement, document.body.firstChild);

        // Clear the flash message from localStorage
        localStorage.removeItem('flashMessage');
        localStorage.removeItem('flashType');

        // Optionally, remove the flash message after a few seconds
        setTimeout(() => {
          flashElement.remove();
        }, 5000);
      }
    };

    async function HandleGet(path) {
      // alert('Foo');
      const response = await fetch(path, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json'

        }, credentials: 'include'
      });

      if (response.ok) {
        setTimeout(() => {
          window.location.href = path;
        }, 100);
      } else {
        const data = await response.json();
        if (data.flashMessage && data.flashType) {
          // Store flash message in localStorage
          localStorage.setItem('flashMessage', data.flashMessage);
          localStorage.setItem('flashType', data.flashType);
        }
        if (data.redirect) {
          console.log("Redirecting to:", data.redirect);
          window.location.href = data.redirect;
        }
      }
    };
    document.getElementById('signupForm').onsubmit = async function (event) {
      event.preventDefault();
      const password = document.querySelector('input[name="password"]').value;
      const confirmPassword = document.querySelector('input[name="cpassword"]').value;

      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }

      if (password.length < 8) {
        alert("Password must be at least 8 characters long.");
        return;
      }

      const formData = new FormData(this);
      try {
        const response = await fetch('/signup', {
          method: 'POST',
          body: new URLSearchParams(formData),
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          }
        });
        const data = await response.json();
        if (data.flashMessage && data.flashType) {
          // Store flash message in localStorage
          localStorage.setItem('flashMessage', data.flashMessage);
          localStorage.setItem('flashType', data.flashType);
        }
        if (data.redirect) {
          window.location.href = data.redirect;
        }
      } catch (error) {
        console.error('Error:', error);
      }
    };
    document.addEventListener('DOMContentLoaded', displayFlashMessage);
  </script>
</body>
